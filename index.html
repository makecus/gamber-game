<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D FPS Shooter</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:20px;
    font-family:Arial;
}
</style>

</head>

<body>

<div id="ui">
❤️ HP : <span id="hp">100</span><br>
🔫 Ammo : <span id="ammo">20</span>/20<br>
🏆 Score : <span id="score">0</span>
</div>


<canvas id="game"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


canvas.width=innerWidth;
canvas.height=innerHeight;



let player={
x:canvas.width/2,
y:canvas.height/2,
size:25,
speed:5,
hp:100
};



let keys={};


let bullets=[];

let enemies=[];


let ammo=20;

let score=0;


let mouse={
x:0,
y:0
};




// 키 입력

document.onkeydown=e=>{
keys[e.code]=true;

if(e.code==="KeyR"){
ammo=20;
}

};


document.onkeyup=e=>{
keys[e.code]=false;
};



// 마우스

canvas.onmousemove=e=>{

mouse.x=e.clientX;
mouse.y=e.clientY;

};



// 발사

canvas.onclick=()=>{


if(ammo<=0)return;


ammo--;


let angle=Math.atan2(
mouse.y-player.y,
mouse.x-player.x
);


bullets.push({

x:player.x,
y:player.y,

dx:Math.cos(angle)*10,
dy:Math.sin(angle)*10

});


};




// 적 생성

function spawnEnemy(){

enemies.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,

size:25,

hp:50,

speed:1.2

});

}


for(let i=0;i<5;i++)
spawnEnemy();




// 업데이트

function update(){


// 이동

if(keys["KeyW"])
player.y-=player.speed;

if(keys["KeyS"])
player.y+=player.speed;

if(keys["KeyA"])
player.x-=player.speed;

if(keys["KeyD"])
player.x+=player.speed;



// 총알

for(let i=bullets.length-1;i>=0;i--){

let b=bullets[i];

b.x+=b.dx;
b.y+=b.dy;



if(
b.x<0||
b.y<0||
b.x>canvas.width||
b.y>canvas.height
){

bullets.splice(i,1);

}



}




// 적 AI

for(let e of enemies){


let angle=Math.atan2(
player.y-e.y,
player.x-e.x
);


e.x+=Math.cos(angle)*e.speed;
e.y+=Math.sin(angle)*e.speed;



// 플레이어 공격

if(
Math.hypot(
player.x-e.x,
player.y-e.y
)<30
){

player.hp-=0.3;

}



}



// 충돌

for(let i=enemies.length-1;i>=0;i--){

let e=enemies[i];


for(let j=bullets.length-1;j>=0;j--){

let b=bullets[j];


if(
Math.hypot(
e.x-b.x,
e.y-b.y
)<30
){

e.hp-=25;

bullets.splice(j,1);


if(e.hp<=0){

enemies.splice(i,1);

score++;

spawnEnemy();

}


break;

}


}


}




document.getElementById("hp").innerHTML=
Math.floor(player.hp);

document.getElementById("ammo").innerHTML=
ammo;

document.getElementById("score").innerHTML=
score;



if(player.hp<=0){

alert("GAME OVER");

location.reload();

}


}




// 그리기

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// 플레이어

ctx.fillStyle="cyan";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
player.size,
0,
Math.PI*2
);

ctx.fill();



// 총알

ctx.fillStyle="yellow";

for(let b of bullets){

ctx.beginPath();

ctx.arc(
b.x,
b.y,
5,
0,
Math.PI*2
);

ctx.fill();

}



// 적

ctx.fillStyle="red";


for(let e of enemies){

ctx.beginPath();

ctx.arc(
e.x,
e.y,
e.size,
0,
Math.PI*2
);

ctx.fill();

}



}




function loop(){

update();

draw();

requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
