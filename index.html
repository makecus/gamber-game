<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D FPS Shooter</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:20px;

<body>

<div id="ui">
❤️ HP : <span id="hp">100</span><br>
🔫 Ammo : <span id="ammo">20</span>/20<br>
🏆 Score : <span id="score">0</span>
</div>


<canvas id="game"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


canvas.width=innerWidth;
canvas.height=innerHeight;



let player={
x:canvas.width/2,
y:canvas.height/2,
size:25,
speed:5,
hp:100
};



let keys={};


let bullets=[];

let enemies=[];


let ammo=20;

let score=0;


let mouse={
x:0,
y:0
};




// 키 입력

document.onkeydown=e=>{
keys[e.code]=true;

if(e.code==="KeyR"){
ammo=20;
}

};


document.onkeyup=e=>{
keys[e.code]=false;
};



// 마우스

canvas.onmousemove=e=>{

mouse.x=e.clientX;
mouse.y=e.clientY;

};



// 발사

canvas.onclick=()=>{


if(ammo<=0)return;


ammo--;


let angle=Math.atan2(
mouse.y-player.y,
mouse.x-player.x
);


bullets.push({

x:player.x,
y:player.y,

dx:Math.cos(angle)*10,
dy:Math.sin(angle)*10

});


};




// =======================
// 50종 몬스터 데이터
// =======================

const monsterTypes=[

// =======================
// 몬스터 생성 변경
// =======================

function spawnEnemy(){

let type=
monsterTypes[
Math.floor(
Math.random()*monsterTypes.length
)
];


enemies.push({

name:type[0],

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,

size:type[3],

hp:type[1],

maxHp:type[1],

speed:type[2],

color:type[4],

damage:type[5],

reward:type[6]

});

}


for(let i=0;i<5;i++)
spawnEnemy();




// 업데이트

function update(){


// 이동

if(keys["KeyW"])
player.y-=player.speed;

if(keys["KeyS"])
player.y+=player.speed;

if(keys["KeyA"])
player.x-=player.speed;

if(keys["KeyD"])
player.x+=player.speed;



// 총알

for(let i=bullets.length-1;i>=0;i--){

let b=bullets[i];

b.x+=b.dx;
b.y+=b.dy;



if(
b.x<0||
b.y<0||
b.x>canvas.width||
b.y>canvas.height
){

bullets.splice(i,1);

}



}




// 적 AI

for(let e of enemies){


let angle=Math.atan2(
player.y-e.y,
player.x-e.x
);


e.x+=Math.cos(angle)*e.speed;
e.y+=Math.sin(angle)*e.speed;



// 플레이어 공격

if(
Math.hypot(
player.x-e.x,
player.y-e.y
)<30
){

player.hp-=0.3;

}



}



// 충돌

for(let i=enemies.length-1;i>=0;i--){

let e=enemies[i];


for(let j=bullets.length-1;j>=0;j--){

let b=bullets[j];


if(
Math.hypot(
e.x-b.x,
e.y-b.y
)<30
){

e.hp-=25;

bullets.splice(j,1);


if(e.hp<=0){

enemies.splice(i,1);

score++;

spawnEnemy();

}


break;

}


}


}




document.getElementById("hp").innerHTML=
Math.floor(player.hp);

document.getElementById("ammo").innerHTML=
ammo;

document.getElementById("score").innerHTML=
score;



if(player.hp<=0){

alert("GAME OVER");

location.reload();

}


}




// 그리기

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// 플레이어

ctx.fillStyle="cyan";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
player.size,
0,
Math.PI*2
);

ctx.fill();



// 총알

ctx.fillStyle="yellow";

for(let b of bullets){

ctx.beginPath();

ctx.arc(
b.x,
b.y,
5,
0,
Math.PI*2
);

ctx.fill();

}



// 적

ctx.fillStyle="red";


for(let e of enemies){

ctx.beginPath();

ctx.arc(
e.x,
e.y,
e.size,
0,
Math.PI*2
);

ctx.fill();

}



}




function loop(){

update();

draw();

requestAnimationFrame(loop);

}


loop();
// =================================
// 몬스터 외형 + 애니메이션 시스템
// 맨 아래 추가
// =================================


// 몬스터 애니메이션 시간
for(let e of enemies){

    if(e.time===undefined){
        e.time=0;
    }

}



// 몬스터 움직임 애니메이션

function monsterAnimation(e){

    e.time += 0.1;


    // 걷기 흔들림
    e.offset =
    Math.sin(e.time)*3;


    // 날기
    if(e.animation==="fly"){

        e.float =
        Math.sin(e.time)*5;

    }


    // 점프
    if(e.animation==="jump"){

        e.float =
        Math.abs(
        Math.sin(e.time)
        )*15;

    }

}



// 날개

function drawWings(e){

if(!e.wings)return;


ctx.fillStyle=e.wingColor || "white";


ctx.beginPath();

ctx.ellipse(
-e.size,
0,
e.size/2,
e.size,
0,
0,
Math.PI*2
);

ctx.fill();



ctx.beginPath();

ctx.ellipse(
e.size,
0,
e.size/2,
e.size,
0,
0,
Math.PI*2
);

ctx.fill();


}



// 갑옷

function drawArmor(e){

if(!e.armor)return;


ctx.strokeStyle=
e.armorColor || "silver";


ctx.lineWidth=6;


ctx.beginPath();

ctx.arc(
0,
0,
e.size+8,
0,
Math.PI*2
);

ctx.stroke();


}



// 무기

function drawMonsterWeapon(e){

if(!e.weapon)return;



// 검

if(e.weapon==="sword"){


ctx.fillStyle="gray";

ctx.fillRect(
e.size,
-5,
35,
10
);


}


// 불

if(e.weapon==="fire"){


ctx.fillStyle="orange";


ctx.beginPath();

ctx.arc(
e.size+20,
0,
15,
0,
Math.PI*2
);

ctx.fill();


}


// 레이저

if(e.weapon==="laser"){


ctx.fillStyle="cyan";


ctx.fillRect(
e.size,
-3,
40,
6
);


}


// 지팡이

if(e.weapon==="staff"){


ctx.fillStyle="gold";


ctx.fillRect(
e.size,
-25,
5,
50
);


}


}



// 특수 효과

function drawMonsterEffect(e){



if(e.effect==="flame"){


ctx.fillStyle="orange";

ctx.beginPath();

ctx.arc(
0,
-e.size,
15,
0,
Math.PI*2
);

ctx.fill();


}



if(e.effect==="shadow"){


ctx.shadowBlur=30;

ctx.shadowColor="purple";


}



if(e.effect==="electric"){


ctx.strokeStyle="yellow";

ctx.lineWidth=3;


ctx.beginPath();

ctx.arc(
0,
0,
e.size+15,
0,
Math.PI*2
);

ctx.stroke();


}



}



// 최종 몬스터 그리기

function drawCustomMonster(e){


monsterAnimation(e);


ctx.save();


ctx.translate(
e.x,
e.y+(e.float||0)
);



drawMonsterEffect(e);


drawWings(e);


drawArmor(e);



// 몸

ctx.fillStyle=e.color;


ctx.beginPath();

ctx.arc(
0,
0,
e.size,
0,
Math.PI*2
);

ctx.fill();



// 눈

ctx.fillStyle="white";


ctx.beginPath();

ctx.arc(
-e.size/3,
-5,
5,
0,
Math.PI*2
);

ctx.fill();


ctx.beginPath();

ctx.arc(
e.size/3,
-5,
5,
0,
Math.PI*2
);

ctx.fill();



// 무기

drawMonsterWeapon(e);



ctx.restore();


}

// =================================

function addMonsterStyle(e,type){


if(type==="dragon"){

e.wings=true;
e.weapon="fire";
e.effect="flame";
e.animation="fly";

}


if(type==="knight"){

e.armor=true;
e.weapon="sword";
e.effect="shadow";
e.animation="walk";

}



if(type==="robot"){

e.armor=true;
e.weapon="laser";
e.effect="electric";
e.animation="walk";

}


}

// =====================================
// 몬스터 카드 도감 + 뽑기 시스템
// 맨 아래 추가
// =====================================


let monsterBook=[];


// 등급

const rarity=[
{
name:"일반",
chance:60,
color:"gray"
},
{
name:"희귀",
chance:25,
color:"blue"
},
{
name:"영웅",
chance:10,
color:"purple"
},
{
name:"전설",
chance:4,
color:"orange"
},
{
name:"신화",
chance:1,
color:"gold"
}
];



// 카드 생성

function createMonsterCard(monster){


let r=Math.random()*100;

let total=0;

let rank;


for(let i of rarity){

total+=i.chance;


if(r<=total){

rank=i;

break;

}

}



let card={

name:monster.name,

hp:monster.hp,

speed:monster.speed,

rarity:rank.name,

color:rank.color,

level:1

};


monsterBook.push(card);


saveBook();


showCard(card);


}



// 저장

function saveBook(){

localStorage.setItem(
"monsterBook",
JSON.stringify(monsterBook)
);

}



// 불러오기

function loadBook(){

let data=
localStorage.getItem(
"monsterBook"
);


if(data){

monsterBook=
JSON.parse(data);

}

}

loadBook();



// 뽑기

function monsterGacha(){


let monster=
monsterTypes[
Math.floor(
Math.random()*monsterTypes.length
)
];



createMonsterCard(monster);


}



// 카드 표시

function showCard(card){


let box=
document.createElement("div");


box.style.position="absolute";

box.style.left="50%";

box.style.top="50%";

box.style.transform=
"translate(-50%,-50%)";


box.style.width="250px";

box.style.height="350px";


box.style.background=
card.color;


box.style.borderRadius="20px";


box.style.color="white";

box.style.fontSize="25px";

box.style.textAlign="center";

box.style.paddingTop="30px";


box.innerHTML=`

<h2>${card.name}</h2>

<hr>

등급 : ${card.rarity}

<br><br>

❤️ ${card.hp}

<br>

⚡ ${card.speed}

<br><br>

LV.${card.level}

`;



document.body.appendChild(box);



setTimeout(()=>{

box.remove();

},3000);


}

}

// 몬스터 경험치 추가

function addMonsterExp(monster,exp){


if(!monster.exp)
monster.exp=0;


if(!monster.level)
monster.level=1;



monster.exp+=exp;



let need=
monster.level*100;



if(monster.exp>=need){


monster.exp=0;

monster.level++;


monster.hp+=50;



console.log(
monster.name+
" 레벨업!"
);



checkEvolution(monster);


}



}





// 진화 확인

function checkEvolution(monster){


let list=
evolutionData[monster.name];


if(!list)
return;



for(let evo of list){


if(monster.level>=evo.level){


monster.name=evo.name;

monster.hp=evo.hp;

monster.color=evo.color;



monster.evolved=true;



}

}



}



// 진화 이펙트

function drawEvolutionEffect(monster){


if(!monster.evolved)
return;


ctx.save();


ctx.translate(
monster.x,
monster.y
);



ctx.strokeStyle="gold";

ctx.lineWidth=5;


ctx.beginPath();

ctx.arc(
0,
0,
monster.size+20,
0,
Math.PI*2
);

ctx.stroke();



ctx.restore();


}





// 처치 시 경험치 지급

function rewardMonsterExp(){


for(let m of monsterBook){


addMonsterExp(
m,
10
);


}


}
    // =====================================
// 몬스터 펫 전투 + 던전 시스템
// =====================================


// 플레이어 펫

let activePet=null;


// 골드

let gold=0;



// 펫 선택

function selectPet(index){


if(!monsterBook[index])
return;


activePet=
monsterBook[index];


alert(
activePet.name+
" 장착!"
);


}



// 펫 공격

function petAttack(){


if(!activePet)
return;



let target=enemies[0];


if(!target)
return;



target.hp-=activePet.hp/50;



// 처치

if(target.hp<=0){


let index=
enemies.indexOf(target);


if(index!=-1){

enemies.splice(
index,
1
);

score+=50;

spawnEnemy();

}


}



}



// 자동 공격

setInterval(()=>{

petAttack();

},1000);





// =================================
// 던전 시스템
// =================================


let dungeonRunning=false;



function enterDungeon(){


if(!activePet){

alert(
"펫을 먼저 선택하세요"
);

return;

}



if(dungeonRunning)
return;



dungeonRunning=true;



alert(
activePet.name+
" 던전 출발!"
);



let time=
10;



let timer=setInterval(()=>{


time--;



if(time<=0){


clearInterval(timer);


dungeonRunning=false;



let reward=
Math.floor(
activePet.hp/10
)+
Math.random()*100;



reward=Math.floor(reward);



gold+=reward;



alert(
"던전 성공!\n"+
reward+
" 골드 획득"
);



updateGold();



}



},1000);



}





// 골드 표시

function updateGold(){


let g=
document.getElementById(
"gold"
);


if(g)
g.innerHTML=gold;


}



// 몬스터 강화

function upgradePet(){


if(!activePet)
return;



if(gold<100)
{

alert(
"골드 부족"
);

return;

}



gold-=100;


activePet.hp+=100;


alert(
"펫 강화 성공!"
);


updateGold();


}
</script>
