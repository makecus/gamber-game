<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D FPS Shooter</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:20px;
    font-family:Arial;
}
</style>

</head>

<body>

<div id="ui">
❤️ HP : <span id="hp">100</span><br>
🔫 Ammo : <span id="ammo">20</span>/20<br>
🏆 Score : <span id="score">0</span>
</div>


<canvas id="game"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


canvas.width=innerWidth;
canvas.height=innerHeight;



let player={
x:canvas.width/2,
y:canvas.height/2,
size:25,
speed:5,
hp:100
};



let keys={};


let bullets=[];

let enemies=[];


let ammo=20;

let score=0;


let mouse={
x:0,
y:0
};




// 키 입력

document.onkeydown=e=>{
keys[e.code]=true;

if(e.code==="KeyR"){
ammo=20;
}

};


document.onkeyup=e=>{
keys[e.code]=false;
};



// 마우스

canvas.onmousemove=e=>{

mouse.x=e.clientX;
mouse.y=e.clientY;

};



// 발사

canvas.onclick=()=>{


if(ammo<=0)return;


ammo--;


let angle=Math.atan2(
mouse.y-player.y,
mouse.x-player.x
);


bullets.push({

x:player.x,
y:player.y,

dx:Math.cos(angle)*10,
dy:Math.sin(angle)*10

});


};




// =======================
// 50종 몬스터 데이터
// =======================

const monsterTypes=[

["슬라임",30,2.5,20,"lime",1,10],
["좀비",80,1.2,25,"green",2,20],
["해골병사",120,1,28,"white",3,30],
["고블린",60,2,22,"orange",2,25],
["오크",250,0.7,40,"brown",8,80],
["늑대",100,2.8,25,"gray",4,40],
["거미",50,3,18,"black",2,20],
["박쥐",40,3.5,15,"purple",2,15],
["불꽃악마",180,1.5,35,"red",10,100],
["얼음골렘",400,0.5,50,"cyan",15,150],

["독충",70,2.6,20,"yellow",3,35],
["돌골렘",500,0.4,60,"gray",20,200],
["어둠기사",300,1,35,"darkred",12,120],
["마법사",150,1.3,30,"violet",8,90],
["암살자",100,3,22,"black",7,70],
["용병",200,1.5,30,"orange",6,60],
["뱀",90,2.7,20,"green",3,30],
["좀비개",130,2.2,25,"darkgreen",5,50],
["괴수",700,0.3,70,"maroon",25,300],
["미니드래곤",350,1.8,35,"firebrick",15,200],

["화염정령",220,2,30,"orangered",12,130],
["물정령",220,1.8,30,"blue",10,120],
["바람정령",160,3,25,"skyblue",8,100],
["번개정령",180,3.2,25,"yellow",14,150],
["독정령",200,1.7,35,"limegreen",10,120],
["거대벌",250,2.5,40,"gold",15,180],
["갑옷병사",350,0.8,45,"silver",12,150],
["망령",180,2.2,30,"purple",9,110],
["흡혈귀",300,1.6,35,"darkred",15,220],
["늪괴물",450,0.6,55,"olive",20,250],

["사막전사",250,1.4,35,"tan",10,140],
["정글괴물",300,1.5,40,"green",12,160],
["로봇",400,1,45,"gray",15,200],
["전투로봇",600,0.7,55,"silver",25,300],
["외계인",220,2,30,"pink",10,150],
["우주괴물",500,0.8,60,"purple",20,280],
["돌연변이",350,1.3,45,"green",18,230],
["기계거미",300,2,35,"black",14,190],
["그림자괴물",280,2.5,30,"black",15,210],
["황금슬라임",500,1,45,"gold",20,400],

["고대용",1000,0.3,90,"darkorange",50,1000],
["아이스드래곤",900,0.5,80,"lightblue",45,900],
["암흑용",1200,0.4,100,"black",70,1500],
["천사타락자",700,1,70,"white",40,800],
["마왕군병사",500,1.2,50,"red",25,500],
["마왕",3000,0.2,120,"purple",100,5000],
["차원괴물",2000,0.5,110,"magenta",80,4000],
["우주보스",5000,0.2,150,"blue",150,10000],
["최종병기",8000,0.1,170,"red",200,20000],
["신급몬스터",10000,0.05,200,"gold",300,50000]

];



// =======================
// 몬스터 생성 변경
// =======================

function spawnEnemy(){

let type=
monsterTypes[
Math.floor(
Math.random()*monsterTypes.length
)
];


enemies.push({

name:type[0],

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,

size:type[3],

hp:type[1],

maxHp:type[1],

speed:type[2],

color:type[4],

damage:type[5],

reward:type[6]

});

}


for(let i=0;i<5;i++)
spawnEnemy();




// 업데이트

function update(){


// 이동

if(keys["KeyW"])
player.y-=player.speed;

if(keys["KeyS"])
player.y+=player.speed;

if(keys["KeyA"])
player.x-=player.speed;

if(keys["KeyD"])
player.x+=player.speed;



// 총알

for(let i=bullets.length-1;i>=0;i--){

let b=bullets[i];

b.x+=b.dx;
b.y+=b.dy;



if(
b.x<0||
b.y<0||
b.x>canvas.width||
b.y>canvas.height
){

bullets.splice(i,1);

}



}




// 적 AI

for(let e of enemies){


let angle=Math.atan2(
player.y-e.y,
player.x-e.x
);


e.x+=Math.cos(angle)*e.speed;
e.y+=Math.sin(angle)*e.speed;



// 플레이어 공격

if(
Math.hypot(
player.x-e.x,
player.y-e.y
)<30
){

player.hp-=0.3;

}



}



// 충돌

for(let i=enemies.length-1;i>=0;i--){

let e=enemies[i];


for(let j=bullets.length-1;j>=0;j--){

let b=bullets[j];


if(
Math.hypot(
e.x-b.x,
e.y-b.y
)<30
){

e.hp-=25;

bullets.splice(j,1);


if(e.hp<=0){

enemies.splice(i,1);

score++;

spawnEnemy();

}


break;

}


}


}




document.getElementById("hp").innerHTML=
Math.floor(player.hp);

document.getElementById("ammo").innerHTML=
ammo;

document.getElementById("score").innerHTML=
score;



if(player.hp<=0){

alert("GAME OVER");

location.reload();

}


}




// 그리기

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// 플레이어

ctx.fillStyle="cyan";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
player.size,
0,
Math.PI*2
);

ctx.fill();



// 총알

ctx.fillStyle="yellow";

for(let b of bullets){

ctx.beginPath();

ctx.arc(
b.x,
b.y,
5,
0,
Math.PI*2
);

ctx.fill();

}



// 적

ctx.fillStyle="red";


for(let e of enemies){

ctx.beginPath();

ctx.arc(
e.x,
e.y,
e.size,
0,
Math.PI*2
);

ctx.fill();

}



}




function loop(){

update();

draw();

requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
